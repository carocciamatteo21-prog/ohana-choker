<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohana Choker</title>
<style>
:root{--bg:#ffffff;--text:#111111;--text2:#555555;--text3:#999999;--border:#e4e4e4;--muted:#f3f3f4;--surface:#ffffff;--pos:#16a34a;--warn:#d97706;--danger:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--text:#f0f0f0;--text2:#b5b5b5;--text3:#7c7c7c;--border:#333333;--muted:#242424;--surface:#1d1d1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:24px}
button,input{font:inherit}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 32px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600}
.dot{width:12px;height:12px;background:#ef4444;border-radius:6px;flex:none}
.iconbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer}
.iconbtn:hover{color:var(--text);border-color:var(--text3)}
.hero{text-align:center;padding:24px 0 8px}
h1{font-size:32px;font-weight:600;line-height:1.15;margin:0 0 8px}
.tag{color:var(--text2);margin:0 auto;max-width:560px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;margin-top:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.wheelcard{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px;border:1px solid var(--border);border-radius:12px}
.wheelbox{position:relative;width:100%;max-width:340px}
.wheelbox svg{display:block;width:100%;height:auto}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid var(--text);z-index:2}
.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text3);pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:10px;border:1px solid var(--text);background:var(--text);color:var(--bg);font-weight:600;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text)}
.card{padding:24px;border:1px solid var(--border);border-radius:12px}
.card h3{margin:0 0 12px;font-size:17px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);outline:none}
.input:focus{border-color:var(--text)}
.odds{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.odds-row{display:flex;align-items:center;gap:8px;font-size:14px}
.odds-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.odds-pct{width:44px;text-align:right;color:var(--text2);font-variant-numeric:tabular-nums}
.bar{width:88px;height:6px;border-radius:3px;background:var(--muted);overflow:hidden;flex:none}
.bar i{display:block;height:100%}
.note{font-size:12px;color:var(--text3);margin-top:8px}
.result{margin-top:16px;padding:16px;border-radius:10px;border:1px solid var(--border);display:none}
.result.show{display:block}
.result .r-prize{font-size:24px;font-weight:600;margin:4px 0 8px}
.footer{text-align:center;color:var(--text3);font-size:13px;padding:24px 0 0}
.admin{margin-top:24px;border:1px solid var(--border);border-radius:12px;padding:24px;display:none}
.admin.show{display:block}
.tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:12px}
.tab{padding:8px 14px;border-radius:8px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:14px}
.tab.active{background:var(--muted);color:var(--text)}
.pane{display:none}
.pane.active{display:block}
.prize-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.prize-row .input{flex:1}
.prize-row .w-input{width:80px;flex:none}
.rowact{opacity:0;display:flex;gap:4px;transition:opacity .15s}
.prize-row:hover .rowact,.winrow:hover .rowact{opacity:1}
.mini{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer}
.mini:hover{color:var(--text);border-color:var(--text3)}
.stats{display:flex;gap:24px;margin-bottom:16px}
.stat b{font-size:28px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--text2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--text3);font-weight:400;padding:8px;border-bottom:1px solid var(--border)}
td{padding:10px 8px;border-bottom:1px solid var(--border)}
.winrow td:first-child{font-weight:600}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px}
.badge.ok{background:rgba(22,163,74,.14);color:var(--pos)}
.badge.wait{background:rgba(217,119,6,.14);color:var(--warn)}
.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:9}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:8;padding:16px}
.mask.show{display:flex}
.dialog{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:340px}
.dialog h3{margin:0 0 12px;font-size:17px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:12px}
.confetti i{position:absolute;width:6px;height:10px;top:-12px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand"><span class="dot"></span><span id="brandName">Ohana Choker</span></div>
    <button class="iconbtn" id="adminBtn" type="button">&#9881; <span id="adminBtnLabel">Area admin</span></button>
  </div>

  <div class="hero">
    <h1 id="heroTitle">Ohana Choker</h1>
    <p class="tag" id="heroTag"></p>
  </div>

  <div class="grid">
    <div class="wheelcard">
      <div class="wheelbox">
        <div class="pointer"></div>
        <div class="confetti" id="confetti"></div>
        <svg viewBox="0 0 320 320" id="wheelSvg" xmlns="http://www.w3.org/2000/svg">
          <circle cx="160" cy="160" r="156" fill="none" stroke="var(--border)" stroke-width="1"/>
          <g id="wheelG" style="transition:transform 4.6s cubic-bezier(0.15,0.9,0.1,1);transform-origin:160px 160px"></g>
        </svg>
        <div class="hub">ohana</div>
      </div>
      <button class="btn" id="spinBtn" type="button" disabled>Caricamento…</button>
    </div>

    <div class="card">
      <h3>Gioca</h3>
      <div class="field">
        <label for="playerName">Il tuo nome</label>
        <input class="input" id="playerName" type="text" maxlength="30" placeholder="Inserisci il tuo nome per girare" autocomplete="off">
      </div>
      <h3 style="font-size:15px">Probabilità dei premi</h3>
      <div class="odds" id="oddsList"></div>
      <div class="result" id="resultBox">
        <div style="font-size:13px;color:var(--text2)" id="resultWho"></div>
        <div class="r-prize" id="resultPrize"></div>
        <button class="btn ghost" id="resultClose" type="button" style="padding:8px 16px;font-size:14px">Chiudi</button>
      </div>
    </div>
  </div>

  <div class="footer" id="footNote"></div>

  <div class="admin" id="adminPanel">
    <div class="tabs">
      <button class="tab active" data-tab="premi" type="button">Premi</button>
      <button class="tab" data-tab="vincitori" type="button">Vincitori</button>
      <button class="tab" data-tab="sito" type="button">Modifica sito</button>
    </div>

    <div class="pane active" data-pane="premi">
      <p style="color:var(--text2);font-size:14px;margin:0 0 16px">Aggiungi, modifica o elimina i premi. Il numero accanto al nome è il peso: più è alto, più il premio è probabile. Ricorda di salvare.</p>
      <div id="prizeRows"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="iconbtn" id="addPrize" type="button">&#43; Aggiungi premio</button>
        <button class="btn" id="savePrizes" type="button" style="padding:8px 16px;font-size:14px">Salva premi</button>
      </div>
    </div>

    <div class="pane" data-pane="vincitori">
      <div class="stats">
        <div class="stat"><b id="stTotal">0</b><span>giri totali</span></div>
        <div class="stat"><b id="stVer">0</b><span>verificati</span></div>
        <div class="stat"><b id="stPending">0</b><span>in attesa</span></div>
      </div>
      <div class="toolbar">
        <button class="iconbtn" id="exportCsv" type="button">Esporta CSV</button>
        <button class="iconbtn" id="clearWinners" type="button">Svuota elenco</button>
        <button class="iconbtn" id="refreshWinners" type="button">Aggiorna</button>
      </div>
      <div id="winnersTable"></div>
    </div>

    <div class="pane" data-pane="sito">
      <div class="field"><label>Nome del sito / attività</label><input class="input" id="setTitle" type="text"></div>
      <div class="field"><label>Sottotitolo</label><input class="input" id="setTag" type="text"></div>
      <div class="field"><label>Testo del pulsante</label><input class="input" id="setSpin" type="text"></div>
      <div class="field"><label>Nota a piè di pagina</label><input class="input" id="setFoot" type="text"></div>
      <div class="field"><label>Nuova password admin (lascia vuoto per non cambiarla)</label><input class="input" id="setPass" type="text"></div>
      <button class="btn" id="saveSite" type="button">Salva modifiche</button>
    </div>
  </div>
</div>

<div class="mask" id="loginMask">
  <div class="dialog" style="text-align:center">
    <h3>Accesso admin</h3>
    <div class="field" style="text-align:left"><label>Password</label><input class="input" id="loginPass" type="password" placeholder="Password"></div>
    <div style="color:var(--danger);font-size:13px;min-height:20px" id="loginErr"></div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn" id="loginOk" type="button">Entra</button>
      <button class="btn ghost" id="loginCancel" type="button">Annulla</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
var CFG={title:'Ohana Choker',tagline:'',spinLabel:'Gira la ruota',footer:'',prizes:[]};
var token=sessionStorage.getItem('ohana_token')||'';
var rotation=0,spinning=false,adminOn=false,winners=[];

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(msg){var t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none';},2400);}
function api(path,opts){
  opts=opts||{};
  opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(token)opts.headers['Authorization']='Bearer '+token;
  return fetch(path,opts).then(function(r){return r.json().then(function(j){
    if(!r.ok)throw new Error(j.error||'Errore di connessione');return j;});
  }).catch(function(e){toast(e.message);throw e;});
}

var HUES=['#3b82f6','#ef4444','#22c55e','#a855f7','#6b7280'];
var TINTS=['#93c5fd','#fca5a5','#86efac','#d8b4fe','#d1d5db'];
function sliceColor(i,n){var c=HUES[i%5];if(n>5&&i>=5)c=TINTS[i%5];return c;}

function renderSite(){
  document.title=CFG.title;
  $('brandName').textContent=CFG.title;
  $('heroTitle').textContent=CFG.title;
  $('heroTag').textContent=CFG.tagline;
  $('footNote').textContent=CFG.footer;
  $('spinBtn').textContent=CFG.spinLabel;
}
function validPrizes(){return CFG.prizes.filter(function(p){return p.weight>0&&String(p.name).trim();});}
function renderWheel(){
  var g=$('wheelG'),prizes=validPrizes(),n=prizes.length;
  g.innerHTML='';
  if(n<2){$('spinBtn').disabled=true;$('spinBtn').textContent='Ruota non configurata';return;}
  if(!spinning){$('spinBtn').disabled=false;$('spinBtn').textContent=CFG.spinLabel;}
  var seg=360/n,R=148,html='';
  for(var i=0;i<n;i++){
    var a1=(i*seg-90)*Math.PI/180,a2=((i+1)*seg-90)*Math.PI/180;
    var x1=160+R*Math.cos(a1),y1=160+R*Math.sin(a1),x2=160+R*Math.cos(a2),y2=160+R*Math.sin(a2);
    html+='<path d="M160 160 L'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+R+' '+R+' 0 0 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' Z" fill="'+sliceColor(i,n)+'" stroke="var(--bg)" stroke-width="1.5"/>';
    var mid=((i+0.5)*seg-90)*Math.PI/180,lr=R*0.62;
    var tx=160+lr*Math.cos(mid),ty=160+lr*Math.sin(mid),deg=(i+0.5)*seg;
    var label=prizes[i].name.length>16?prizes[i].name.slice(0,15)+'…':prizes[i].name;
    html+='<text x="'+tx.toFixed(1)+'" y="'+ty.toFixed(1)+'" transform="rotate('+deg.toFixed(1)+' '+tx.toFixed(1)+' '+ty.toFixed(1)+')" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#fff" style="pointer-events:none">'+esc(label)+'</text>';
  }
  html+='<circle cx="160" cy="160" r="30" fill="var(--surface)" stroke="var(--border)"/>';
  g.innerHTML=html;
}
function renderOdds(){
  var prizes=validPrizes(),total=prizes.reduce(function(a,p){return a+Number(p.weight);},0)||1,html='';
  prizes.forEach(function(p,i){
    var pct=Math.round(p.weight/total*1000)/10;
    html+='<div class="odds-row"><div class="odds-name">'+esc(p.name)+'</div><div class="bar"><i style="width:'+Math.min(100,pct)+'%;background:'+sliceColor(i,prizes.length)+'"></i></div><div class="odds-pct">'+pct+'%</div></div>';
  });
  $('oddsList').innerHTML=html||'<div class="note">Nessun premio configurato.</div>';
}
function renderPrizeRows(){
  $('prizeRows').innerHTML=CFG.prizes.map(function(p,i){
    return '<div class="prize-row" data-i="'+i+'">'+
      '<input class="input" type="text" value="'+esc(p.name)+'" data-f="name" placeholder="Nome premio">'+
      '<input class="input w-input" type="number" min="1" value="'+p.weight+'" data-f="weight" title="Peso (probabilità)">'+
      '<div class="rowact"><button class="mini" data-del="'+i+'" type="button" title="Elimina">&#128465;</button></div></div>';
  }).join('');
}
function renderWinners(){
  var list=winners.slice().sort(function(a,b){return b.ts-a.ts;});
  $('stTotal').textContent=winners.length;
  $('stVer').textContent=winners.filter(function(w){return w.verified;}).length;
  $('stPending').textContent=winners.length-winners.filter(function(w){return w.verified;}).length;
  if(!list.length){$('winnersTable').innerHTML='<div class="note">Nessun giro registrato finora.</div>';return;}
  var html='<table><thead><tr><th>Nome</th><th>Premio</th><th>Data</th><th>Stato</th><th></th></tr></thead><tbody>';
  list.forEach(function(w){
    var d=new Date(w.ts).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    html+='<tr class="winrow"><td>'+esc(w.name)+'</td><td>'+esc(w.prize)+'</td><td style="color:var(--text2)">'+d+'</td>'+
      '<td>'+(w.verified?'<span class="badge ok">Verificato</span>':'<span class="badge wait">In attesa</span>')+'</td>'+
      '<td><div class="rowact" style="justify-content:flex-end">'+
      '<button class="mini" data-verify="'+w.id+'" type="button" title="Verifica">'+'&#10003;'+'</button>'+
      '<button class="mini" data-wdel="'+w.id+'" type="button" title="Elimina">&#128465;</button>'+
      '</div></td></tr>';
  });
  $('winnersTable').innerHTML=html+'</tbody></table>';
}
function confetti(){
  var box=$('confetti'),cols=HUES,html='';
  for(var i=0;i<26;i++){html+='<i style="left:'+Math.random()*100+'%;background:'+cols[i%4]+';animation-delay:'+(Math.random()*0.4)+'s"></i>';}
  box.innerHTML=html;setTimeout(function(){box.innerHTML='';},2000);
}
function loadWinners(){return api('/api/winners').then(function(j){winners=j.winners||[];renderWinners();});}

$('spinBtn').addEventListener('click',function(){
  if(spinning)return;
  var name=$('playerName').value.trim();
  if(name.length<2){toast('Inserisci il tuo nome per giocare');$('playerName').focus();return;}
  var prizes=validPrizes();if(prizes.length<2)return;
  spinning=true;$('spinBtn').disabled=true;$('resultBox').classList.remove('show');
  api('/api/spin',{method:'POST',body:JSON.stringify({name:name})}).then(function(j){
    var idx=-1;
    prizes.forEach(function(p,i){if(p.name===j.prize&&idx<0)idx=i;});
    if(idx<0)idx=0;
    var seg=360/prizes.length;
    var jitter=(Math.random()*0.6-0.3)*seg*0.8;
    var pointerAngle=idx*seg+seg/2+jitter;
    var targetMod=((360-pointerAngle)%360+360)%360;
    var delta=((targetMod-(rotation%360))%360+360)%360;
    rotation+=360*5+delta;
    $('wheelG').style.transform='rotate('+rotation+'deg)';
    setTimeout(function(){
      spinning=false;$('spinBtn').disabled=false;
      if(adminOn)loadWinners();
      var lose=j.prize.toLowerCase()==='riprova';
      $('resultWho').textContent=lose?'Peccato, '+name+'…':'Complimenti, '+name+'!';
      $('resultPrize').textContent=j.prize;
      $('resultBox').classList.add('show');
      if(!lose)confetti();
    },4700);
  }).catch(function(){spinning=false;$('spinBtn').disabled=false;});
});
$('resultClose').addEventListener('click',function(){$('resultBox').classList.remove('show');});

$('addPrize').addEventListener('click',function(){
  CFG.prizes.push({id:Date.now(),name:'Nuovo premio',weight:10});renderPrizeRows();toast('Premio aggiunto: ricorda di salvare');
});
$('prizeRows').addEventListener('input',function(e){
  var row=e.target.closest('.prize-row');if(!row)return;
  var i=+row.dataset.i,f=e.target.dataset.f;
  if(f==='name')CFG.prizes[i].name=e.target.value;
  else CFG.prizes[i].weight=Math.max(0,Number(e.target.value)||0);
});
$('prizeRows').addEventListener('click',function(e){
  var b=e.target.closest('[data-del]');if(!b)return;
  if(CFG.prizes.length<=2){toast('Servono almeno 2 premi');return;}
  CFG.prizes.splice(+b.dataset.del,1);renderPrizeRows();toast('Premio eliminato: ricorda di salvare');
});
$('savePrizes').addEventListener('click',function(){
  api('/api/config',{method:'PUT',body:JSON.stringify({prizes:CFG.prizes})}).then(function(cfg){
    CFG.prizes=cfg.prizes;renderWheel();renderOdds();renderPrizeRows();toast('Premi salvati');
  });
});
document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
  document.querySelectorAll('.pane').forEach(function(x){x.classList.remove('active');});
  t.classList.add('active');
  document.querySelector('.pane[data-pane="'+t.dataset.tab+'"]').classList.add('active');
});});
$('adminBtn').addEventListener('click',function(){
  if(adminOn){adminOn=false;$('adminPanel').classList.remove('show');$('adminBtnLabel').textContent='Area admin';return;}
  if(token){enterAdmin();return;}
  $('loginMask').classList.add('show');$('loginPass').value='';$('loginErr').textContent='';
  setTimeout(function(){$('loginPass').focus();},50);
});
function enterAdmin(){
  loadWinners().then(function(){
    adminOn=true;$('loginMask').classList.remove('show');$('adminPanel').classList.add('show');
    $('adminBtnLabel').textContent='Esci admin';renderPrizeRows();
    $('setTitle').value=CFG.title;$('setTag').value=CFG.tagline;$('setSpin').value=CFG.spinLabel;$('setFoot').value=CFG.footer;$('setPass').value='';
  }).catch(function(){token='';sessionStorage.removeItem('ohana_token');});
}
function tryLogin(){
  api('/api/login',{method:'POST',body:JSON.stringify({password:$('loginPass').value})}).then(function(j){
    token=j.token;sessionStorage.setItem('ohana_token',token);enterAdmin();
  }).catch(function(){$('loginErr').textContent='Password errata, riprova.';});
}
$('loginOk').addEventListener('click',tryLogin);
$('loginPass').addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});
$('loginCancel').addEventListener('click',function(){$('loginMask').classList.remove('show');});
$('saveSite').addEventListener('click',function(){
  var body={title:$('setTitle').value,tagline:$('setTag').value,spinLabel:$('setSpin').value,footer:$('setFoot').value};
  if($('setPass').value.trim())body.password=$('setPass').value.trim();
  api('/api/config',{method:'PUT',body:JSON.stringify(body)}).then(function(cfg){
    CFG.title=cfg.title;CFG.tagline=cfg.tagline;CFG.spinLabel=cfg.spinLabel;CFG.footer=cfg.footer;
    renderSite();toast('Sito aggiornato');
  });
});
$('winnersTable').addEventListener('click',function(e){
  var v=e.target.closest('[data-verify]'),d=e.target.closest('[data-wdel]');
  if(v){api('/api/winners/'+v.dataset.verify+'/verify',{method:'POST'}).then(function(){loadWinners();toast('Stato aggiornato');});}
  if(d){api('/api/winners/'+d.dataset.wdel,{method:'DELETE'}).then(function(){loadWinners();toast('Voce eliminata');});}
});
$('refreshWinners').addEventListener('click',function(){loadWinners().then(function(){toast('Elenco aggiornato');});});
$('clearWinners').addEventListener('click',function(){
  if(!winners.length){toast('Elenco già vuoto');return;}
  if(confirm('Eliminare tutti i vincitori registrati?')){
    api('/api/winners',{method:'DELETE'}).then(function(){loadWinners();toast('Elenco svuotato');});
  }
});
$('exportCsv').addEventListener('click',function(){
  var csv='Nome;Premio;Data;Verificato\n';
  winners.forEach(function(w){csv+=w.name+';'+w.prize+';'+new Date(w.ts).toLocaleString('it-IT')+';'+(w.verified?'SI':'NO')+'\n';});
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ohana_choker_vincitori.csv';a.click();
  URL.revokeObjectURL(a.href);toast('CSV esportato');
});

api('/api/config').then(function(cfg){
  CFG=cfg;renderSite();renderWheel();renderOdds();
  if(token)enterAdmin();
}).catch(function(){$('spinBtn').textContent='Server non raggiungibile';});
})();
</script>
</body>
</html>
